{% extends "base.html" %}

{% block title %}Add Pay Raise{% endblock %}

{% block content %}
<h2>Add Pay Raise</h2>

<form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <label for="PayRaiseDate">Pay Raise Date:</label><br>
    <input type="date" id="PayRaiseDate" name="PayRaiseDate" required><br><br>

    <label for="RaiseAmt">Raise Amount:</label><br>
    <input type="text" id="RaiseAmt" name="RaiseAmt"><br><br>

    <input type="submit" value="Submit">
</form>
{% endblock %}
