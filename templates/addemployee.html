{% extends "base.html" %}

{% block content %}
<h2>Add a New Employee</h2>

<form action="/addrec" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Name:</label><br>
    <input type="text" name="Name"><br><br>

    <label>Age:</label><br>
    <input type="text" name="Age"><br><br>

    <label>Phone Number:</label><br>
    <input type="tel" name="PhNum"><br><br>

    <label for="SecurityLevel">Security Level:</label><br>
    <select id="SecurityLevel" name="SecurityLevel">
        {% for option in security_level_options %}
        <option value="{{ option['value'] }}">{{ option["label"] }}</option>
        {% endfor %}
    </select><br><br>

    <label>Temporary Password:</label><br>
    <input type="password" name="Password"><br><br>

    <input type="submit" value="Submit">
</form>
{% endblock %}
