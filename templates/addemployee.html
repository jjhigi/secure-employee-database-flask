{% extends "base.html" %}

{% block title %}Add Employee{% endblock %}

{% block content %}
<h2>Add Employee</h2>

<form action="{{ url_for('employee.addrec') }}" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <label for="Name">Name:</label><br>
    <input type="text" id="Name" name="Name"><br><br>

    <label for="Age">Age:</label><br>
    <input type="text" id="Age" name="Age"><br><br>

    <label for="PhNum">Phone Number:</label><br>
    <input type="tel" id="PhNum" name="PhNum"><br><br>

    <label for="SecurityLevel">Security Level:</label><br>
    <select id="SecurityLevel" name="SecurityLevel">
        {% for option in security_level_options %}
        <option value="{{ option['value'] }}">{{ option["label"] }}</option>
        {% endfor %}
    </select><br><br>

    <label for="Password">Temporary Password:</label><br>
    <input type="password" id="Password" name="Password"><br><br>

    <input type="submit" value="Add Employee">
</form>
{% endblock %}
