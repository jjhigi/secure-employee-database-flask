{% extends "base.html" %}

{% block content %}
  <h2>Pay Raise Records</h2>

  <table border="1">
    <tr>
      <td>Pay Raise ID</td>
      <td>Employee ID</td>
      <td>Pay Raise Date</td>
      <td>Raise Amount</td>
    </tr>

    {% for row in rows %}
      <tr>
        <td>{{ row["PayRaiseID"] }}</td>
        <td>{{ row["EmpID"] }}</td>
        <td>{{ row["PayRaiseDate"] }}</td>
        <td>{{ row["RaiseAmt"] }}</td>
      </tr>
    {% endfor %}
  </table>
{% endblock %}
