{% extends "base.html" %}

{% block content %}
<h2>Submit Pay Raise Deletion Request</h2>

<form method="post" action="/submitdeletepayraise">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Employee ID:</label><br>
    <input type="number" name="EmpID" required><br><br>

    <label>Pay Raise Date:</label><br>
    <input type="date" name="PayRaiseDate" required><br><br>

    <input type="submit" value="Submit">
</form>
{% endblock %}
