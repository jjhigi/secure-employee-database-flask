{% extends "base.html" %}

{% block content %}
<h2>Edit Employee</h2>

<form method="post" action="/editemployee/{{ employee['UserID'] }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Name:</label><br>
    <input type="text" name="Name" value="{{ employee['Name'] }}"><br><br>

    <label>Age:</label><br>
    <input type="text" name="Age" value="{{ employee['Age'] }}"><br><br>

    <label>Phone Number:</label><br>
    <input type="tel" name="PhNum" value="{{ employee['PhNum'] }}"><br><br>

    <label for="SecurityLevel">Security Level:</label><br>
    <select id="SecurityLevel" name="SecurityLevel">
        {% for option in security_level_options %}
            {% if employee["SecurityLevel"] == option["value"] %}
            <option value="{{ option['value'] }}" selected>{{ option["label"] }}</option>
            {% else %}
            <option value="{{ option['value'] }}">{{ option["label"] }}</option>
            {% endif %}
        {% endfor %}
    </select><br><br>

    <input type="submit" value="Save Changes">
</form>
{% endblock %}
