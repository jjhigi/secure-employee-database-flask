{% extends "base.html" %}

{% block content %}
<h2>Reset Employee Password</h2>

<p>Reset password for: <strong>{{ employee["Name"] }}</strong></p>

<form method="post" action="/resetpassword/{{ employee['UserID'] }}">
    <label>New Temporary Password:</label><br>
    <input type="password" name="Password"><br><br>

    <label>Confirm New Temporary Password:</label><br>
    <input type="password" name="ConfirmPassword"><br><br>

    <input type="submit" value="Reset Password">
</form>
{% endblock %}
