{% extends "base.html" %}

{% block title %}Reset Employee Password{% endblock %}

{% block content %}
<h2>Reset Employee Password</h2>

<p>Reset password for: <strong>{{ employee["Name"] }}</strong></p>

<form
        method="post"
        action="{{ url_for('employee.resetpassword', user_id=employee['UserID']) }}"
>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <label for="Password">New Temporary Password:</label><br>
    <input type="password" id="Password" name="Password"><br><br>

    <label for="ConfirmPassword">Confirm New Temporary Password:</label><br>
    <input
            type="password"
            id="ConfirmPassword"
            name="ConfirmPassword"
    ><br><br>

    <input type="submit" value="Reset Password">
</form>
{% endblock %}
