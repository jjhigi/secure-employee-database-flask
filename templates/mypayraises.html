{% extends "base.html" %}

{% block content %}
<h2>My Pay Raises</h2>

{% if rows %}
<table border="1">
    <tr>
        <td>Pay Raise Date</td>
        <td>Raise Amount</td>
    </tr>

    {% for row in rows %}
    <tr>
        <td>{{ row["PayRaiseDate"] }}</td>
        <td>{{ row["RaiseAmt"] }}</td>
    </tr>
    {% endfor %}
</table>
{% else %}
<p>No active pay raise records found.</p>
{% endif %}
{% endblock %}
