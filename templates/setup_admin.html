{% extends "base.html" %}

{% block title %}Initial Admin Setup{% endblock %}

{% block content %}
<h2>Initial Admin Setup</h2>

<p>Create the first administrator account for this local database.</p>

<form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <label for="Name">Name:</label><br>
    <input type="text" id="Name" name="Name" required><br><br>

    <label for="Age">Age:</label><br>
    <input type="number" id="Age" name="Age" min="1" max="120" required><br><br>

    <label for="PhNum">Phone Number:</label><br>
    <input type="text" id="PhNum" name="PhNum" required><br><br>

    <label for="CurrentSalary">Current Salary:</label><br>
    <input
            type="number"
            id="CurrentSalary"
            name="CurrentSalary"
            min="0.01"
            max="1000000.00"
            step="0.01"
            required
    ><br><br>

    <label for="Password">Password:</label><br>
    <input type="password" id="Password" name="Password" required><br><br>

    <label for="ConfirmPassword">Confirm Password:</label><br>
    <input
            type="password"
            id="ConfirmPassword"
            name="ConfirmPassword"
            required
    ><br><br>

    <input type="submit" value="Create First Admin">
</form>
{% endblock %}
