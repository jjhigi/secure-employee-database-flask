{% extends "base.html" %}

{% block content %}
  <h2>Send HMAC-Authenticated Pay Raise Message</h2>

  <form method="post" action="/sendaddpayraisehmac">
    <label for="EmpId">Employee ID:</label><br>
    <input type="text" id="EmpId" name="EmpID"><br><br>

    <label for="PayRaiseDate">Pay Raise Date:</label><br>
    <input type="date" id="PayRaiseDate" name="PayRaiseDate"><br><br>

    <label for="RaiseAmt">Raise Amount:</label><br>
    <input type="text" id="RaiseAmt" name="RaiseAmt"><br><br>

    <input type="submit" value="Submit">
  </form>
{% endblock %}
